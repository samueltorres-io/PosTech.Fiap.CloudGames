services:
  cloudgames-postgres:
    image: postgres:16-alpine
    container_name: cloudgames-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: cloudgames
      POSTGRES_PASSWORD: cloudgames
      POSTGRES_DB: cloudgames
    ports:
      # Host 5433 para não conflitar com outros Postgres locais (container continua em 5432).
      - "5433:5432"
    volumes:
      - cloudgames-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloudgames -d cloudgames"]
      interval: 5s
      timeout: 5s
      retries: 10

  cloudgames-pgadmin:
    image: dpage/pgadmin4:latest
    container_name: cloudgames-pgadmin
    restart: unless-stopped
    profiles: ["tools"]
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@cloudgames.local
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    depends_on:
      - cloudgames-postgres

volumes:
  cloudgames-pgdata:
