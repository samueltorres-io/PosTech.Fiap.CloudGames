services:
  fcg-postgres:
    image: postgres:16-alpine
    container_name: fcg-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: fcg
      POSTGRES_PASSWORD: fcg
      POSTGRES_DB: fcg
    ports:
      # Host 5433 para não conflitar com outros Postgres locais (container continua em 5432).
      - "5433:5432"
    volumes:
      - fcg-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fcg -d fcg"]
      interval: 5s
      timeout: 5s
      retries: 10

  fcg-pgadmin:
    image: dpage/pgadmin4:latest
    container_name: fcg-pgadmin
    restart: unless-stopped
    profiles: ["tools"]
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@fcg.local
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    depends_on:
      - fcg-postgres

volumes:
  fcg-pgdata:
